name: Validate and deploy dividend radar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dividend-pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate indicator calculations
        run: |
          python scripts/test_technicals.py
          python scripts/test_fundamentals.py
          python scripts/test_market.py
      - name: Refresh complete market data
        if: github.event_name != 'push'
        id: refresh
        continue-on-error: true
        run: python scripts/update_data.py
      - name: Preserve last valid snapshot on failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::warning::Refresh failed. Publishing last valid snapshot with its original timestamp.'
          test -f data/stocks.json
      - name: Refresh closing market overview
        if: github.event_name != 'push'
        id: market_refresh
        continue-on-error: true
        run: python scripts/update_market.py
      - name: Preserve last valid market snapshot on failure
        if: steps.market_refresh.outcome == 'failure'
        run: |
          echo '::warning::Market refresh failed. Retaining original market snapshot date.'
          test -f data/market.json
      - name: Commit successful snapshots
        if: steps.refresh.outcome == 'success' || steps.market_refresh.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stocks.json data/market.json
          git diff --cached --quiet || git commit -m 'data: refresh dividend snapshot'
          git push
      - name: Prepare public files
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js share.js live-data.js market.html market.css market.js _site/
          cp data/stocks.json data/market.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report refresh failure
        if: steps.refresh.outcome == 'failure' || steps.market_refresh.outcome == 'failure'
        run: exit 1
