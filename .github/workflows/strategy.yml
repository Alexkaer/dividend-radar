name: Daily strategy screen
on:
  schedule:
    - cron: '20 1 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '查询阶段（北京时间）'
        type: choice
        default: auto
        options: [auto, auction, intraday, close]
      pullback_only:
        description: '只更新涨停回调低吸'
        type: boolean
        default: false
      ma_pullback_only:
        description: '只更新涨停回调 · MA20止损'
        type: boolean
        default: false
      cutoff:
        description: '盘中截点（北京时间HH:MM；历史补发可用）'
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: private-strategy-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify strategy rules
        run: |
          python scripts/test_strategy.py
          node scripts/test_strategy_ranking.cjs
      - name: Generate public strategy snapshot
        env:
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
          STRATEGY_LOGIN_USERNAME: ${{ secrets.STRATEGY_LOGIN_USERNAME }}
          STRATEGY_LOGIN_PASSWORD: ${{ secrets.STRATEGY_LOGIN_PASSWORD }}
          QUERY_SCHEDULE: ${{ github.event.schedule }}
          QUERY_MODE: ${{ inputs.mode || 'auto' }}
          PULLBACK_ONLY: ${{ inputs.pullback_only || false }}
          MA_PULLBACK_ONLY: ${{ inputs.ma_pullback_only || false }}
          QUERY_CUTOFF: ${{ inputs.cutoff || '' }}
        run: |
          umask 077
          mode="$QUERY_MODE"
          case "$QUERY_SCHEDULE" in
            '20 1 * * 1-5') mode=auction ;;
            '30 6 * * 1-5') mode=intraday; QUERY_CUTOFF=14:30 ;;
            '30 7 * * 1-5') mode=close ;;
          esac
          if [ -f data/strategies.json ]; then
            cp data/strategies.json "$RUNNER_TEMP/previous-strategy.json"
          else
            node scripts/encrypt_strategy.cjs --decrypt data/strategies.enc.json "$RUNNER_TEMP/previous-strategy.json"
          fi
          options=()
          if [ "$PULLBACK_ONLY" = 'true' ]; then options+=(--pullback-only); fi
          if [ "$MA_PULLBACK_ONLY" = 'true' ]; then options+=(--ma-pullback-only); fi
          if [ -n "$QUERY_CUTOFF" ]; then options+=(--cutoff "$QUERY_CUTOFF"); fi
          if ! python scripts/strategy_screen.py --mode "$mode" --previous "$RUNNER_TEMP/previous-strategy.json" "${options[@]}" --output "$RUNNER_TEMP/private-strategy.json" ||
             [ ! -f "$RUNNER_TEMP/private-strategy.json" ]; then
            public_group=all
            if [ "$PULLBACK_ONLY" = 'true' ]; then public_group=pullback; fi
            if [ "$MA_PULLBACK_ONLY" = 'true' ]; then public_group=maPullback; fi
            echo "MX did not produce a snapshot. Retrying $public_group with public market data."
            python scripts/strategy_screen.py --mode "$mode" --public-pullback "$public_group" --previous "$RUNNER_TEMP/previous-strategy.json" --output "$RUNNER_TEMP/private-strategy.json"
          fi
          rm "$RUNNER_TEMP/previous-strategy.json"
          if [ -f "$RUNNER_TEMP/private-strategy.json" ]; then
            mv "$RUNNER_TEMP/private-strategy.json" data/strategies.json
          fi
      - name: Publish strategy snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategies.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update public strategy snapshot'
            git pull --rebase origin main
            git push origin main
          fi
